name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      # pnpm publish delegates to the system npm CLI; trusted publishing (OIDC)
      # needs npm >= 11.5.1, newer than the one bundled with Node 22.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Verify tag matches package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for pkg in packages/*/package.json; do
            version="$(node -p "require('./$pkg').version")"
            if [ "$version" != "$tag" ]; then
              echo "::error::$pkg is $version but tag is $tag"
              exit 1
            fi
          done

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/pack-smoke.mjs
      # Authenticates via npm trusted publishing (OIDC) — no token required.
      - run: pnpm --recursive --filter "./packages/**" publish --access public --no-git-checks
